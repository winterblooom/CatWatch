<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#160029"/>
      <stop offset="50%" style="stop-color:#773344"/>
      <stop offset="100%" style="stop-color:#D44D5C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" rx="16" fill="url(#bg)"/>
  
  <!-- Cat face -->
  <!-- Left ear -->
  <polygon points="95,55 115,95 75,95" fill="#F5E9E2" opacity="0.9"/>
  <!-- Right ear -->
  <polygon points="185,55 205,95 165,95" fill="#F5E9E2" opacity="0.9"/>
  <!-- Head -->
  <circle cx="140" cy="135" r="50" fill="#F5E9E2" opacity="0.9"/>
  <!-- Left eye -->
  <ellipse cx="120" cy="125" rx="8" ry="10" fill="#160029"/>
  <circle cx="118" cy="122" r="3" fill="#4ade80"/>
  <!-- Right eye -->
  <ellipse cx="160" cy="125" rx="8" ry="10" fill="#160029"/>
  <circle cx="158" cy="122" r="3" fill="#4ade80"/>
  <!-- Nose -->
  <polygon points="140,140 135,147 145,147" fill="#D44D5C"/>
  <!-- Mouth -->
  <path d="M 130 152 Q 140 160 150 152" stroke="#773344" stroke-width="2" fill="none"/>
  <!-- Whiskers left -->
  <line x1="80" y1="135" x2="120" y2="140" stroke="#E3B5A4" stroke-width="1.5" opacity="0.6"/>
  <line x1="82" y1="148" x2="120" y2="147" stroke="#E3B5A4" stroke-width="1.5" opacity="0.6"/>
  <!-- Whiskers right -->
  <line x1="200" y1="135" x2="160" y2="140" stroke="#E3B5A4" stroke-width="1.5" opacity="0.6"/>
  <line x1="198" y1="148" x2="160" y2="147" stroke="#E3B5A4" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Magnifying glass -->
  <circle cx="195" cy="155" r="18" fill="none" stroke="#F5E9E2" stroke-width="3" opacity="0.7"/>
  <line x1="208" y1="168" x2="222" y2="182" stroke="#F5E9E2" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="270" y="120" font-family="Segoe UI, sans-serif" font-size="56" font-weight="700" fill="#F5E9E2" letter-spacing="6">CATWATCH</text>
  
  <!-- Subtitle -->
  <text x="270" y="155" font-family="Segoe UI, sans-serif" font-size="16" fill="#E3B5A4">Анализ журналов событий Windows</text>
  <text x="270" y="178" font-family="Segoe UI, sans-serif" font-size="16" fill="#E3B5A4">на предмет подозрительной активности</text>
  
  <!-- Tags -->
  <rect x="270" y="195" width="75" height="24" rx="4" fill="#D44D5C33" stroke="#D44D5C" stroke-width="1"/>
  <text x="307" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#D44D5C" text-anchor="middle">Python</text>
  
  <rect x="355" y="195" width="95" height="24" rx="4" fill="#E3B5A433" stroke="#E3B5A4" stroke-width="1"/>
  <text x="402" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#E3B5A4" text-anchor="middle">45 правил</text>
  
  <rect x="460" y="195" width="100" height="24" rx="4" fill="#9f7aea33" stroke="#9f7aea" stroke-width="1"/>
  <text x="510" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#9f7aea" text-anchor="middle">Корреляция</text>
  
  <rect x="570" y="195" width="110" height="24" rx="4" fill="#ca8a0433" stroke="#ca8a04" stroke-width="1"/>
  <text x="625" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle">HTML-отчёты</text>
</svg>
